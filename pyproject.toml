[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asrt-bench"
version = "0.1.0"
description = "Fire a frozen attack pack at your AI agent, verify what lands, and diff safety across versions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agent", "security", "prompt-injection", "regression-testing", "ai-safety"]

dependencies = [
    "rich>=13",            # console rendering
    "prompt_toolkit>=3",   # console input; falls back to input() without it
    "aiohttp>=3.9",        # target executors (Ollama / OpenAI-compatible)
    "tenacity>=8",         # executor retry policy
    "python-dotenv>=1",    # endpoint config from .env
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
asrt-bench = "asrtbench.cli:main"

[tool.setuptools.packages.find]
include = ["asrtbench*"]

[tool.setuptools.package-data]
asrtbench = ["packs/**/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
